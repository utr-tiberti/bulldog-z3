<script>
'use strict';
/* BULLDOG Z3 — Livello 1: il magazzino utensili
   Motore: canvas 960x540 logico, passo fisso 1/60 s, tutto disegnato a codice tranne il protagonista. */
(() => {
const W = 960, H = 540, FLOOR = 460, DT = 1 / 60;
const FONT = '"Bangers","Impact","Arial Black",sans-serif';
const INK = '#16120f';

/* ---------- protagonista: coordinate nel ritaglio originale 851x1043 ---------- */
const SPR = { cw: 851, ch: 1043, bodyX: 300, footY: 1036, legY: 740, bodyCut: 800, splitX: 325,
  hipL: [215, 760], hipR: [430, 760], chest: [250, 500], face: [141, 0, 306, 330] };
const PH = 112;                       // altezza a video del bulldog in piedi
const PS = PH / SPR.ch;               // da px ritaglio a px gioco
const IMG = new Image(); IMG.src = SPRITE_DATA;
let IMGW = null;                      // silhouette bianca per il lampo quando viene colpito
IMG.onload = () => {
  const c = document.createElement('canvas'); c.width = IMG.width; c.height = IMG.height;
  const g = c.getContext('2d'); g.drawImage(IMG, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  IMGW = c;
};

/* ---------- utilità ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = rng(7);

/* ---------- canvas ---------- */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const ww = window.innerWidth, wh = window.innerHeight;
  scale = Math.min(ww / W, wh / H);
  cv.width = Math.round(ww * dpr); cv.height = Math.round(wh * dpr);
  cv.style.width = ww + 'px'; cv.style.height = wh + 'px';
  offX = (ww - W * scale) / 2; offY = (wh - H * scale) / 2;
}
window.addEventListener('resize', resize); resize();

/* ---------- input ---------- */
const keys = {}, touch = {};
const input = { left: 0, right: 0, down: 0, jump: 0, fire: 0, jumpP: 0, fireP: 0, startP: 0, pauseP: 0 };
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowDown: 'down', KeyS: 'down',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump', KeyX: 'fire', KeyJ: 'fire', KeyK: 'fire', ControlLeft: 'fire' };
window.addEventListener('keydown', e => {
  initAudio();
  const k = KEYMAP[e.code];

function collideMove(o, dx, dy, useOneway = true) {
  let hitX = 0, hitTop = null, hitBottom = null;
  o.x += dx;
  for (const s of G.L.solids) { if (s.open) continue; if (overlap(o, s)) { if (dx > 0) o.x = s.x - o.w; else if (dx < 0) o.x = s.x + s.w; hitX = dx > 0 ? 1 : -1; } }
  const prevBottom = o.y + o.h;
  o.y += dy;
  for (const s of G.L.solids) { if (s.open) continue; if (overlap(o, s)) { if (dy > 0) { o.y = s.y - o.h; hitBottom = s; } else if (dy < 0) { o.y = s.y + s.h; hitTop = s; } } }
  if (useOneway && dy > 0) {
    for (const s of G.L.oneways.concat(G.L.movers)) {
      if (prevBottom <= s.y + 0.5 && o.y + o.h >= s.y && o.x < s.x + s.w && o.x + o.w > s.x) { o.y = s.y - o.h; hitBottom = s; }
    }
  }
  return { hitX, hitTop, hitBottom };
}
function blockedAt(r) { for (const s of G.L.solids) if (!s.open && overlap(r, s)) return true; return false; }
function groundAt(x, y) { // c'è appoggio nel punto (x,y)?
  for (const s of G.L.solids) if (!s.open && x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) return true;
  for (const s of G.L.oneways.concat(G.L.movers)) if (x >= s.x && x <= s.x + s.w && Math.abs(y - s.y) < 6) return true;
  return false;
}
function groundYBelow(x, y) {
  let best = H + 60;
  for (const s of G.L.solids) if (!s.open && x >= s.x && x <= s.x + s.w && s.y >= y - 2 && s.y < best) best = s.y;
  for (const s of G.L.oneways.concat(G.L.movers)) if (x >= s.x && x <= s.x + s.w && s.y >= y - 2 && s.y < best) best = s.y;
  return best;
}

/* ---------- ciclo ---------- */
function update() {
  readInput();
  G.t += DT; G.stateT += DT;
  if (G.state === 'title') { playTheme('title'); if (input.startP || input.jumpP) { sfx('select'); startLevel(false); } }
  else if (G.state === 'pause') { if (input.pauseP || input.startP) G.state = 'play'; }
  else if (G.state === 'over') { if (G.stateT > 0.8 && (input.startP || input.jumpP)) { sfx('select'); startLevel(true); } }
  else if (G.state === 'win') { if (G.stateT > 1.5 && (input.startP || input.jumpP)) { sfx('select'); G.state = 'title'; } }
  else if (G.state === 'play') {
    if (input.pauseP) { G.state = 'pause'; }
    else {
      if (!G.bossStarted || G.boss) G.time += DT;
      updateMovers(); updatePlayer(); updateEnemies(); updateShots(); updatePickups();
      if (!G.bossStarted && P.x > ARENA_X + 90) startBoss();
      updateBoss();
      // camera
      let target = P.x + P.w / 2 - W * 0.4 + P.facing * 40;
      if (G.bossStarted) target = ARENA_X;
      target = clamp(target, 0, LEVEL_END - W);
      G.camX = lerp(G.camX, target, G.bossStarted ? 0.08 : 0.12);
      if (!G.bossStarted) G.camX = clamp(G.camX, 0, ARENA_X);
    }
  }
  if (G.state !== 'pause') {
    for (const p of G.parts) { p.t += DT; p.vy += (p.g || 0) * DT; p.x += (p.vx || 0) * DT; p.y += p.vy * DT; if (p.vr) p.rot += p.vr * DT; }
    G.parts = G.parts.filter(p => p.t < p.life);
    for (const p of G.pops) p.t += DT; G.pops = G.pops.filter(p => p.t < p.life);
    G.shake = Math.max(0, G.shake - DT); if (!G.shake) G.shakeMag = 0;
    G.bannerT = Math.max(0, G.bannerT - DT); G.flashT = Math.max(0, G.flashT - DT);

}

  }
  for (const s of L.oneways) if (vis(s)) drawOneway(s);
  for (const sg of L.signs) if (vis(sg)) drawSign(sg);
  if (vis({ x: L.checkpoint.x - 10, w: 80 })) drawCheckpoint(L.checkpoint);
  for (const s of L.solids) if (s.kind !== 'machine' && vis(s)) drawSolid(s);
  for (const m of L.movers) if (vis(m)) drawMover(m);
  for (const hz of L.hazards) if (vis(hz) && hz.y < H) drawChips(hz);
  for (const p of L.pickups) if (vis(p)) drawPickup(p);
  for (const e of L.enemies) if (vis(e)) drawEnemy(e);
  drawBoss();
  if (G.state !== 'over' || P.ko) drawPlayer();
  for (const s of L.solids) if (s.kind === 'machine' && vis(s)) drawSolid(s);  // la macchina copre il bulldog nel passaggio
  for (const b of G.bullets) drawMill(b.x, b.y, b.r, b.rot);
  for (const s of G.eshots) drawEShot(s);
  drawParticles(); drawPops();
  ctx.restore();
  if (G.flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${G.flashT / 0.35})`; ctx.fillRect(0, 0, W, H); }
  drawHUD(); drawTouch();
  if (G.bannerT > 0 && G.state === 'play') { const k = Math.min(1, G.bannerT / 0.4, (2.6 - G.bannerT) / 0.3 + 0.01); ctx.save(); ctx.globalAlpha = clamp(k, 0, 1); panelBox(W / 2 - 280, 120, 560, 64, '#ffd23f'); text(G.banner, W / 2, 153, 32, INK, 'center', 0); ctx.restore(); }
  if (G.state === 'pause') { ctx.fillStyle = 'rgba(10,10,14,0.55)'; ctx.fillRect(0, 0, W, H); panelBox(W / 2 - 160, 210, 320, 110); text('PAUSA', W / 2, 250, 52, '#e23b2e', 'center', 6); text(touchUI ? 'TOCCA PER CONTINUARE' : 'P / INVIO PER CONTINUARE', W / 2, 296, 20, INK, 'center', 0); }
  if (G.state === 'over') drawOver();
  if (G.state === 'win') drawWin();
  // cornice da vignetta
  ctx.beginPath(); ctx.rect(3, 3, W - 6, H - 6); ink(6);
  if (touchUI && window.innerHeight > window.innerWidth) { ctx.fillStyle = 'rgba(10,10,14,0.85)'; ctx.fillRect(0, 0, W, H); panelBox(W / 2 - 250, H / 2 - 60, 500, 120, '#ffd23f'); text('GIRA IL TELEFONO IN ORIZZONTALE', W / 2, H / 2, 34, INK, 'center', 0); }
  ctx.restore();
}

/* --- avvio --- */
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  let n = 0; while (acc >= DT && n < 6) { update(); acc -= DT; n++; }
  musicTick();
  render();
  requestAnimationFrame(frame);
}
G.L = buildLevel();
if (document.fonts && document.fonts.load) document.fonts.load(`40px Bangers`).then(() => { BG_FAR = null; }).catch(() => {});
requestAnimationFrame(frame);

// accesso per i test automatici
window.BZ = { G, P, input, keys, update, startLevel, startBoss, hurtPlayer, render, buildLevel, LEVEL_END, ARENA_X, FLOOR, setCrouch };
})();
